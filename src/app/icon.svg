<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Modern App Store Style Gradient -->
    <linearGradient id="appstore-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="40%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Clean White Rods -->
    <linearGradient id="rod-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Drop Shadow for layered rods -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- App Store Iconic Squircle -->
  <rect x="6" y="6" width="116" height="116" rx="27" fill="url(#appstore-bg)" />

  <!-- Inner subtle border glow -->
  <rect x="7" y="7" width="114" height="114" rx="26" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />

  <!-- App Store inspired Geometric Glyph forming the iconic "1" / "ONE STORE" -->
  <!-- Vertical main pillar of "1" -->
  <rect x="57" y="28" width="14" height="72" rx="7" fill="url(#rod-grad)" filter="url(#shadow)" />

  <!-- Diagonal flag of "1" crossing in classic App Store layered style -->
  <path d="M 64 35 L 36 53 C 32 55 32 61 36 63 C 40 65 46 63 49 59 L 64 49 Z" fill="url(#rod-grad)" filter="url(#shadow)" />

  <!-- Horizontal baseline rod crossing the bottom -->
  <rect x="36" y="86" width="56" height="13" rx="6.5" fill="url(#rod-grad)" filter="url(#shadow)" />

  <!-- Subtle star sparkle dot at upper right corner -->
  <circle cx="92" cy="35" r="4.5" fill="#ffffff" opacity="0.9" />
</svg>
